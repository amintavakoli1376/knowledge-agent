{% from "_shell.html" import shell %}
{% call shell(title, crumb, active, active_doc, tree_docs) %}
      <div class="kg-doc-icon">{{ doc_emoji }}</div>
      <h1 class="kg-title">{{ title }}</h1>
      {% if properties %}{{ properties|safe }}{% endif %}
      {% if doc_id %}
      <!-- U-C4: تغییر وضعیت + نسخه‌ها — متصل به PATCH /api/docs/{id}/status و /versions -->
      <div class="kg-statusbar" data-doc="{{ doc_id }}">
        <button class="kg-st-act" data-st="Starred" title="ستاره‌دار">★</button>
        <button class="kg-st-act" data-st="Read" title="خواندم">✓</button>
        <button class="kg-st-act" data-st="Archived" title="آرشیو">▣</button>
        <span class="kg-st-now kg-small kg-muted"></span>
        <button class="kg-st-act kg-versions-btn" title="نسخه‌های قبلی">نسخه‌ها</button>
      </div>
      <div class="kg-versions" hidden></div>
      {% endif %}
      <div class="kg-blocks">
        {{ body|safe }}
      </div>
      <footer class="kg-footer">
        <span class="kg-small kg-muted">ذخیره‌شده توسط Knowledge Agent · کاغذ</span>
        <a class="kg-small" href="{{ outline_edit_url }}" target="_blank" rel="noopener">ویرایش در Outline</a>
      </footer>
{% endcall %}
